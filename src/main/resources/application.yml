server:
  port: 8080
#日志
logging:
  level:
    root: INFO
    com.collab: DEBUG

#数据库
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/collab_flow?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
    username: root
    password: 155215
    driver-class-name: com.mysql.cj.jdbc.Driver
  #redis
  data:
    redis:
      host: 192.168.100.128
      port: 6380
      password: collab123
      database: 0 # 新容器中直接用默认库
      connect-timeout: 5000

#mybatis-plus的配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.collab.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

#配置knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
#配置文件上传
file:
  upload-path: E:/collabflow/upload